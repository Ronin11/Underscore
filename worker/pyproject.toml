[project]
name = "underscore-worker"
version = "0.1.0"
description = "Builds music maps for books on an Audiobookshelf server, for underscore's map server."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "av>=12",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "requests>=2.31",
    "torch>=2.3",
    "transformers>=4.44",
]

[project.scripts]
underscore-worker = "underscore_worker.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["underscore_worker"]
