[package]
name = "underscore-android"
description = "JNI bridge between the Kotlin shell and the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "underscore_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
underscore-bridge = { path = "../bridge", features = ["transcribe"] }
underscore-decode = { path = "../decode" }
underscore-library = { path = "../library" }
jni = "0.21"
serde_json = "1"

[lints]
workspace = true
