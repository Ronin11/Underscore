[package]
name = "underscore-android"
description = "JNI bridge between the Kotlin shell and the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "underscore_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
underscore-core = { path = "../core" }
underscore-decode = { path = "../decode" }
underscore-library = { path = "../library" }
underscore-map = { path = "../map" }
underscore-transcribe = { path = "../transcribe" }
libc = "0.2"
jni = "0.21"
serde_json = "1"

[lints]
workspace = true
