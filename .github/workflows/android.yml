name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "android/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Build the Rust library for arm64
        run: |
          # The NDK's compilers set directly, as local builds do. A pinned
          # NDK: the runner's newest, 30, has headers whisper-rs-sys's
          # bindgen refuses ("Unversioned target triples are not
          # supported"). Not cargo-ndk: with it, a fresh whisper.cpp build
          # fails to configure (it reaches for the tests and examples the
          # crate does not ship). That stayed hidden while the build cache
          # held a whisper.cpp built long ago.
          NDK_VERSION=28.1.13356709
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK="$NDK_ROOT" ANDROID_NDK_ROOT="$NDK_ROOT" ANDROID_NDK_HOME="$NDK_ROOT"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          echo "NDK: $NDK_ROOT"
          cargo build --release --target aarch64-linux-android -p underscore-android
          # whisper.cpp is C++ and links the NDK's shared C++ runtime, so
          # the APK carries it beside ours.
          out=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$out"
          cp target/aarch64-linux-android/release/libunderscore_android.so "$out/"
          cp "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$out/"
          ls -l "$out"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APKs
        working-directory: android
        # Both modules: the phone app and the Wear OS sleep app.
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          name="underscore-${{ github.run_number }}-${short}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          watch="underscore-watch-${{ github.run_number }}-${short}.apk"
          cp android/wear/build/outputs/apk/release/wear-release.apk "$watch"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "watch=$watch" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.watch }}

      - name: Publish as a pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          prerelease: true
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.watch }}
          body: |
            Try-it build of the underscore Android app from `${{ steps.apk.outputs.short }}`.
            arm64 only, signed with a debug key: Android will ask you to allow
            installs from your browser or file manager.

            Pick a book or podcast file and a music file from your phone, press Play.
            Speed keeps pitch. The music ducks under speech and holds through pauses.
            The music button fades the background out and resumes it in place.

            `underscore-watch-*.apk` is the Wear OS app that tells the phone when
            you fall asleep. Install it on the watch with adb; see docs/android.md.
